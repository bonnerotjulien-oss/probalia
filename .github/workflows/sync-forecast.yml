name: PROBALIA - Calendrier, cotes et prévisions
on:
  schedule:
    - cron: '18 6,12,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualiser les horaires Ligue 1
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync-fixtures.mjs
      - name: Relever les cotes disponibles
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/sync-odds.mjs
      - name: Archiver les prévisions avant match
        run: node scripts/sync-predictions.mjs
      - name: Publier les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/predictions.json
          if test -f data/odds.json; then git add data/odds.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: calendrier, cotes et prévisions"
            git pull --rebase
            git push
          fi
