
name: PROBALIA - Synchroniser les résultats

on:
  schedule:
    - cron: '18 6,12,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Actualiser les resultats de Ligue 1
        run: node scripts/sync-results.mjs

      - name: Actualiser le calendrier et les horaires
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync-fixtures.mjs

      - name: Publier les nouvelles donnees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/fixtures.json
          git diff --cached --quiet || git commit -m "data: synchronisation Ligue 1"
          git push
