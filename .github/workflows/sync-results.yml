
name: PROBALIA - Synchroniser les résultats

on:
  schedule:
    - cron: '18 6,12,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-results.mjs
      - name: Publier si les résultats ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "data: synchronisation Ligue 1"
            git push
