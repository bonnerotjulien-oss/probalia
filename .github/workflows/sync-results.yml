
name: PROBALIA - Synchroniser les résultats

on:
  schedule:
    - cron: '18 6,12,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Actualiser les resultats
        run: node scripts/sync-results.mjs

      - name: Actualiser le calendrier
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync-fixtures.mjs

      - name: Actualiser les cotes des bookmakers
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/sync-odds.mjs

      - name: Publier les nouvelles donnees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: synchronisation PROBALIA V3"
          git push
